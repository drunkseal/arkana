name: Build aarch64 release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft (for review before publishing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-gnu:
    name: Build arkana (aarch64-gnu)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libdrm-dev \
            libgbm-dev \
            libseat-dev \
            libinput-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            linux-headers-generic

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          meson setup builddir
          meson compile -C builddir

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(meson introspect --projectinfo builddir | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package gnu artifact
        run: |
          mkdir -p dist
          cp builddir/arkana "dist/arkana-v${VERSION}-aarch64-unknown-linux-gnu"

      - name: Upload gnu artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-gnu
          path: dist/arkana-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-gnu

  build-musl:
    name: Build arkana (aarch64-musl)
    runs-on: ubuntu-24.04-arm
    container: alpine:3.22
    defaults:
      run:
        shell: sh
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bash \
            build-base \
            ca-certificates \
            curl \
            git \
            linux-headers \
            pkgconf \
            meson \
            ninja \
            cmake \
            fontconfig-dev \
            freetype-dev \
            mesa-dev \
            libdrm-dev \
            eudev-dev \
            libseat-dev \
            libinput-dev \
            libxkbcommon-dev \
            wayland-dev \
            alsa-lib-dev \
            python3

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export GIT_TERMINAL_PROMPT=0
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ GITHUB_REPOSITORY }}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"

      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          meson setup builddir
          meson compile -C builddir

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(meson introspect --projectinfo builddir | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package musl artifact
        run: |
          mkdir -p dist
          cp builddir/arkana "dist/arkana-v${VERSION}-aarch64-unknown-linux-musl"

      - name: Upload musl artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-musl
          path: dist/arkana-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl

  release:
    name: Create GitHub release
    needs: [build-gnu, build-musl]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(grep -m1 "version:" meson.build | sed "s/.*version:[[:space:]]*'\\([^']*\\)'.*/\\1/")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Delete existing release for this version (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --yes >/dev/null 2>&1 || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            arkana-gnu/arkana-v"$VERSION"-aarch64-unknown-linux-gnu \
            arkana-musl/arkana-v"$VERSION"-aarch64-unknown-linux-musl \
            --title "arkana v$VERSION" \
            --notes "Automated aarch64 builds of arkana v$VERSION (gnu + musl)." \
            ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}
