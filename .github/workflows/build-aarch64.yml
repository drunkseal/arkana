name: Build aarch64 release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft (for review before publishing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build arkana for aarch64
    runs-on: ubuntu-24.04-arm
    container: alpine:3.22
    defaults:
      run:
        shell: sh
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bash \
            build-base \
            ca-certificates \
            curl \
            file \
            git \
            linux-headers \
            pkgconf \
            fontconfig-dev \
            freetype-dev \
            mesa-dev \
            libdrm-dev \
            eudev-dev \
            libseat-dev \
            libxkbcommon-dev \
            wayland-dev \
            github-cli

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"

      # JS actions (actions/checkout etc.) don't run in Alpine containers on
      # ARM64 runners, so check out with plain git instead.
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: Bearer ${GITHUB_TOKEN}" fetch --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach "$GITHUB_SHA"

      - name: Build release binary
        run: cargo build --release

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/arkana "dist/arkana-v${VERSION}-aarch64-unknown-linux-musl"
          cp README.md dist/
          echo "arkana v${VERSION} (aarch64-unknown-linux-musl)" > dist/VERSION.txt

      - name: Delete existing release for this version (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --yes >/dev/null 2>&1 || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            dist/arkana-v"$VERSION"-aarch64-unknown-linux-musl \
            dist/README.md \
            dist/VERSION.txt \
            --title "arkana v$VERSION" \
            --notes "Automated aarch64-unknown-linux-musl build of arkana v$VERSION." \
            ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}