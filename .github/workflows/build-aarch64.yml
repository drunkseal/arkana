name: Build aarch64 release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft (for review before publishing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build arkana for aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            git \
            pkg-config \
            libgbm-dev \
            libseat-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/arkana "dist/arkana-v${VERSION}-aarch64-unknown-linux-gnu"
          cp README.md dist/
          echo "arkana v${VERSION} (aarch64-unknown-linux-gnu)" > dist/VERSION.txt

      - name: Delete existing release for this version (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --yes >/dev/null 2>&1 || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            dist/arkana-v"$VERSION"-aarch64-unknown-linux-gnu \
            dist/README.md \
            dist/VERSION.txt \
            --title "arkana v$VERSION" \
            --notes "Automated aarch64-unknown-linux-gnu build of arkana v$VERSION." \
            ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}