name: Build aarch64 release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the release as a draft (for review before publishing)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-gnu:
    name: Build arkana (aarch64-gnu)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-14 \
            meson \
            ninja-build \
            cmake \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libdrm-dev \
            libgbm-dev \
            libseat-dev \
            libinput-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            linux-headers-generic

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          CXX: g++-14
        run: |
          meson setup builddir
          meson compile -C builddir

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(meson introspect --projectinfo builddir | python3 -c 'import sys,json; print(json.load(sys.stdin)["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package gnu artifact
        run: |
          mkdir -p dist
          strip builddir/arkana -o "dist/arkana-v${VERSION}-aarch64-unknown-linux-gnu"

      - name: Upload gnu artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-gnu
          path: dist/arkana-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-gnu

  build-musl:
    name: Build arkana (aarch64-musl)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(grep -m1 "version:" meson.build | sed "s/.*version:[[:space:]]*'\\([^']*\\)'.*/\\1/")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build in Alpine container
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            alpine:3.22 \
            sh -c '
              apk add --no-cache \
                bash build-base ca-certificates curl git linux-headers \
                pkgconf meson ninja cmake fontconfig-dev freetype-dev \
                mesa-dev libdrm-dev eudev-dev libseat-dev libinput-dev \
                libxkbcommon-dev wayland-dev alsa-lib-dev python3 &&
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal &&
              export PATH="$HOME/.cargo/bin:$PATH" &&
              meson setup builddir &&
              meson compile -C builddir
            '

      - name: Package musl artifact
        run: |
          mkdir -p dist
          strip builddir/arkana -o "dist/arkana-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl"

      - name: Upload musl artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-musl
          path: dist/arkana-v${{ steps.version.outputs.version }}-aarch64-unknown-linux-musl

  release:
    name: Create GitHub release
    needs: [build-gnu, build-musl]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Resolve app version
        id: version
        run: |
          VERSION="$(grep -m1 "version:" meson.build | sed "s/.*version:[[:space:]]*'\\([^']*\\)'.*/\\1/")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Delete existing release for this version (idempotent re-runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --yes >/dev/null 2>&1 || true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            arkana-gnu/arkana-v"$VERSION"-aarch64-unknown-linux-gnu \
            arkana-musl/arkana-v"$VERSION"-aarch64-unknown-linux-musl \
            --title "v$VERSION" \
            --notes "Automated aarch64 builds of arkana v$VERSION (gnu + musl)." \
            ${{ github.event.inputs.draft == 'true' && '--draft' || '' }}
