[package]
name = "arkana"
version = "0.2.0"
edition = "2021"

[dependencies]
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-linuxkms",
    "backend-winit-wayland",
    "renderer-femtovg",
] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
alsa = { version = "0.9", optional = true }

[features]
default = ["alsa"]
alsa = ["dep:alsa"]

[build-dependencies]
slint-build = "1.17.1"
